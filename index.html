<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon</title>
  <meta name="description" content="Experience the extraordinary — Horizon">
  <meta name="theme-color" content="#050A1A">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <!-- Favicon (logo) -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===================== PRELOADER ===================== -->
  <div id="preloader" aria-hidden="true">
    <div class="preloader-content">
      <div class="preloader-logo-wrap">
        <img src="assets/images/logo.png" alt="" class="preloader-logo" draggable="false">
        <div class="preloader-shimmer"></div>
      </div>
      <div class="preloader-line"></div>
    </div>
  </div>

  <!-- ============= SPARKLE / DUST PARTICLE OVERLAY ============= -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- ===================== HERO SECTION ===================== -->
  <section id="hero" class="section">
    <!-- Animated gradient orbs background -->
    <div class="hero-bg" aria-hidden="true">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
      <div class="gradient-orb orb-4"></div>
    </div>

    <!-- Mouse-follow spotlight (set via CSS custom properties) -->
    <div class="hero-spotlight" aria-hidden="true"></div>

    <!-- Main hero content -->
    <div class="hero-content">
      <img src="assets/images/logo.png" alt="Horizon" class="hero-logo" draggable="false">
      <p class="hero-tagline">Experience the Extraordinary</p>
    </div>

    <!-- Scroll cue -->
    <div class="scroll-indicator" aria-label="Scroll down">
      <span class="scroll-text">Scroll</span>
      <div class="scroll-line">
        <div class="scroll-line-inner"></div>
      </div>
    </div>
  </section>

  <!-- =================== VIDEO SHOWCASE =================== -->
  <section id="video-section" class="section">
    <!-- Header / Title above video -->
    <div class="video-header">
      <div class="video-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Next Step</span>
      </div>
      <h2 class="video-title">You've Booked a Call! Watch this 1-Min Video</h2>
      <p class="video-subtitle">Please watch this quick overview before our meeting</p>
    </div>

    <div class="video-container" id="video-container">
      <iframe
        id="youtube-video"
        src="https://www.youtube-nocookie.com/embed/hRo3ky6BxDw?rel=0&modestbranding=1&playsinline=1"
        title="Horizon Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>
  </section>

  <!-- ================== BRAND STATEMENT ================== -->
  <section id="brand-statement" class="section">
    <div class="statement-content">
      <p class="statement-text">
        Every great story begins just beyond the horizon
      </p>
    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer id="footer">
    <img src="assets/images/logo.png" alt="Horizon" class="footer-logo" draggable="false">
    <p class="footer-copyright">&copy; 2026 Horizon. All rights reserved.</p>
  </footer>

  <!-- Failsafe: Ensure preloader always dismisses even if assets take time -->
  <script>
    setTimeout(function() {
      var p = document.getElementById('preloader');
      if (p && p.style.display !== 'none') {
        p.style.transition = 'opacity 0.6s ease';
        p.style.opacity = '0';
        setTimeout(function() {
          p.style.display = 'none';
          document.body.style.overflow = '';
        }, 600);
      }
    }, 2800);
  </script>

  <!-- App Entry Point (Bundled via Vite) -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
